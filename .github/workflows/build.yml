# Builds and tests every push and pull request. Pushes to a branch in deploy/servers.json
# deploy each of its servers' sets (deploy/<server>.txt) and publish a release of each but the
# test server's; Run workflow rolls a server back to a release. Staff guide: deploy/README.md. The
# end-to-end test against autodeploy is run by hand (.github/scripts/e2e.sh): autodeploy's
# repository is private.
name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      server:
        description: Server to roll back
        required: true
        type: choice
        options: [survival, event] # deploy/servers.json's servers but test, which keeps no releases
      release:
        description: Release tag to deploy, e.g. deploy-survival-20261001-abc1234
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      servers: ${{ steps.servers.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: servers this branch deploys to
        id: servers
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: echo "servers=$(jq -c --arg b "$BRANCH" '.branches[$b] // []' deploy/servers.json)" >> "$GITHUB_OUTPUT"
      - name: datagen
        run: ./gradlew runDatagen
      - name: build
        run: ./gradlew build
      - name: deploy tooling tests
        run: ./gradlew -p buildSrc test
      - name: build each server's set
        run: |
          for list in deploy/*.txt; do
            ./gradlew deploySet -Pserver="$(basename "$list" .txt)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-sets
          path: build/deploy/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: dist/build/libs/

  reproducible:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: datagen
        run: ./gradlew runDatagen
      - run: .github/scripts/check-reproducible.sh test

  preview:
    # What a merge would upload and remove, read from the real servers without writing.
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.build.outputs.servers != '[]'
    continue-on-error: true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.build.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/download-artifact@v4
        with:
          name: deploy-sets
          path: build/deploy
      - name: dry run for ${{ matrix.server }}
        env:
          AUTODEPLOY_PASSWORD: ${{ secrets.AUTODEPLOY_PASSWORD }}
          SERVER: ${{ matrix.server }}
        run: ./gradlew deployServer -Pserver="$SERVER" -PdryRun=true

  deploy:
    needs: build
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'branch'
      && needs.build.outputs.servers != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.build.outputs.servers) }}
    concurrency:
      group: deploy-${{ matrix.server }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-sets
          path: build/deploy
      - name: is this push still the branch's newest
        # The concurrency group runs deploys one at a time but not in order: an older push that
        # gets its turn after a newer one must not deploy over it. `shell: bash` adds pipefail, so a
        # failing ls-remote fails the job instead of reading as "not the newest".
        id: head
        shell: bash
        run: |
          head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF_NAME is now at ${head:-nothing}, not $GITHUB_SHA; not deploying this older push"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: deploy to ${{ matrix.server }}
        if: steps.head.outputs.newest == 'true'
        env:
          AUTODEPLOY_PASSWORD: ${{ secrets.AUTODEPLOY_PASSWORD }}
          SERVER: ${{ matrix.server }}
        run: ./gradlew deployServer -Pserver="$SERVER" -PdeployDir="build/deploy/$SERVER"
      - name: publish the release
        # Not for the test server: it is never rolled back.
        if: steps.head.outputs.newest == 'true' && matrix.server != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER: ${{ matrix.server }}
        run: |
          tag="deploy-${SERVER}-$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "$GITHUB_SHA")-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists already (a re-run); not publishing it again"
          else
            gh release create "$tag" build/deploy/"$SERVER"/* --target "$GITHUB_SHA" --title "$tag" \
              --notes-file "build/deploy/$SERVER.summary.md" --latest=false
          fi

  rollback:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-${{ inputs.server }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: download ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER: ${{ inputs.server }}
          RELEASE: ${{ inputs.release }}
        run: |
          case "$RELEASE" in
            "deploy-$SERVER-"*) ;;
            *) echo "::error::$RELEASE is not a deploy of $SERVER (expected deploy-$SERVER-...)"; exit 1 ;;
          esac
          mkdir -p "build/deploy/$SERVER"
          gh release download "$RELEASE" --dir "build/deploy/$SERVER" --pattern '*.jar' --pattern manifest.json
      - name: deploy ${{ inputs.release }} to ${{ inputs.server }}
        env:
          AUTODEPLOY_PASSWORD: ${{ secrets.AUTODEPLOY_PASSWORD }}
          SERVER: ${{ inputs.server }}
        run: ./gradlew deployServer -Pserver="$SERVER" -PdeployDir="build/deploy/$SERVER"
