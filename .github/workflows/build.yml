# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS & minimum supported by Minecraft
        ]
        # only run on Linux
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v2
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: datagen
        run: ./gradlew runDatagen
      - name: build
        run: ./gradlew build --info
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: dist/build/libs/
  deploy:
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Artifacts
      - run: ls -la
      - run: rm *-sources.jar
      - name: Deploy to test server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'
        with:
          server: mc.datasektionen.se
          port: 2022
          username: github-actions.098974a0
          password: ${{ secrets.AUTODEPLOY_PASSWORD }}
          local_path: '*.jar'
          remote_path: 'mods/update'
          sftp_only: true
      - name: Deploy to survival server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        if: github.ref == 'refs/heads/prod'
        with:
          server: mc.datasektionen.se
          port: 2022
          username: github-actions.604966da
          password: ${{ secrets.AUTODEPLOY_PASSWORD }}
          local_path: '*.jar'
          remote_path: 'mods/update'
          sftp_only: true