version = project.pirkko_version

// Client screenshot tests: a real client joins an in-process dedicated server and checks what it
// sees. Source set src/gametest, task runClientGameTest (needs a display).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "pirkko-clienttest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        username = "Tester"
    }
}

addPolymerDependency()
// The entity shader that draws the player-head Pirkkos (pirkko.glsl lives there, beside the other mods' effects).
addProjectDependency(":mods:metacraft-shaders")
dependencies {
    implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
    implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
}
