plugins {
    id 'net.fabricmc.fabric-loom' version "$loom_version" apply false
	id("org.jetbrains.gradle.plugin.idea-ext") version "$idea_plugin_version"
	id 'base'
}

def nonModSubProjects = [
        "mods"
]

idea.project.settings {
	runConfigurations {
		"RunServer"(org.jetbrains.gradle.ext.Application) {
			mainClass = "net.fabricmc.devlaunchinjector.Main"
			moduleName = getProject().name + ".dist.main"
			workingDirectory = "./run"
			jvmArgs = "-Dfabric.dli.config=../dist/.gradle/loom-cache/launch.cfg -Dfabric.dli.env=server -Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotServer"
			programParameters = "nogui"
		}
	}
}

// For all modules that are fabric mods (all mods and dist)
subprojects {
    if (nonModSubProjects.contains(it.name)) {
        return
    }
    apply plugin: "net.fabricmc.fabric-loom"

    ext.initDist = { ->
        dependencies {
            rootProject.subprojects.each {
                if (nonModSubProjects.contains(it.name)) {
                    return
                }
                if (it.name == "dist") {
                    return
                }
                implementation(project(path: "${it.path}"))
                include(it)
            }
        }
    }

    ext.addProjectDependency = {dep ->
        dependencies {
            implementation project(path: dep)
        }
        test {
            dependsOn dep + ":test"
        }
    }

    ext.addLeukocyteDependency = { ->
        dependencies {
            //It is slow to update so we usually want it set to compileOnly.
            compileOnly("maven.modrinth:leukocyte:${project.leukocyte_version}")
        }
    }

    ext.addSGUIDependency = { ->
        dependencies {
            implementation("eu.pb4:sgui:${project.sgui_version}")
        }
    }

    ext.addPolymerDependency = { ->
        dependencies {
            implementation("eu.pb4:polymer-core:${project.polymer_version}")
        }
    }

    ext.addCoreDependencies = { ->
        addProjectDependency(":mods:metacraft-core")
        addPolymerDependency()
        addSGUIDependency()
        dependencies {
           implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
           implementation("org.apache.commons:commons-math3:${project.apache_commons_math_version}")
        }
    }

    ext.addVanishDependency = { ->
        dependencies {
            compileOnly "maven.modrinth:vanish:${project.vanish_version}"
            compileOnly "eu.pb4:player-data-api:${project.player_data_api_version}" //Dependency for Vanish.
            compileOnly("eu.pb4:placeholder-api:${project.placeholder_api_version}") //Dependency for Vanish.
        }
    }

    ext.setupRunDatagen = {modid ->
        fabricApi {
            configureDataGeneration{
                modId = modid
                client = true
            }
        }
        for (var s : gradle.startParameter.taskNames) {
            if (s.endsWith("runDatagen")) {
                tasks['sourcesJar'].dependsOn('runDatagen')
                tasks['test'].dependsOn('runDatagen')
            }
        }
    }

    group = project.maven_group

    def targetJavaVersion = 25
    tasks.withType(JavaCompile).configureEach {
        // ensure that the encoding is set to UTF-8, no matter what the system default is
        // this fixes some edge cases with special characters not displaying correctly
        // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
        // If Javadoc is generated, this must be specified in that task too.
        it.options.encoding = "UTF-8"
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            it.options.release.set(targetJavaVersion)
        }
    }

    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.name}"}
        }
    }

    processResources {
		var mcversion = project.fabric_json_mc_version.isEmpty() ? project.minecraft_version : project.fabric_json_mc_version
        inputs.property "version", project.version
        inputs.property "minecraft_version", mcversion
        inputs.property "loader_version", project.loader_version
        filteringCharset "UTF-8"

        filesMatching("fabric.mod.json") {
            expand "version": project.version,
                    "minecraft_version": mcversion,
                    "loader_version": project.loader_version,
                    "git_repo": project.git_repo,
                    "website": project.website,
                    "issues": project.issues
        }
    }

    dependencies {
        // To change the versions see the gradle.properties file
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }

    repositories {
		mavenLocal()

        //Polymer
        maven { url 'https://maven.nucleoid.xyz' }

		maven {
			name = 'ParchmentMC'
			url = 'https://maven.parchmentmc.org'
		}

        //Leukocyte
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        maven { url = 'https://maven.nucleoid.xyz/' }

        //Mod Menu
        maven {
            url "https://maven.terraformersmc.com/"
        }

        maven { url 'https://jitpack.io' } // Fabric ASM
    }
}

// For all mods (but not dist)
subprojects {

    if (nonModSubProjects.contains(it.name)) {
        return
    }

    base {
        archivesName = project.name
    }

    if (project.name != "metacraft-lib") {
        addProjectDependency(":mods:metacraft-lib")
    }

    dependencies {
        // Fabric API. This is technically optional, but you probably want it anyway.
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        implementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}") {
			transitive = false
		}

        testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

        implementation("net.bytebuddy:byte-buddy:${project.byte_buddy_version}")

        implementation("org.pcollections:pcollections:${project.pcollections_version}")
    }

    test {
        useJUnitPlatform()
    }
}
