plugins {
    id 'net.fabricmc.fabric-loom' version "$loom_version" apply false
	id("org.jetbrains.gradle.plugin.idea-ext") version "$idea_plugin_version"
	id 'base'
	id 'checkstyle'
}

def nonModSubProjects = [
        "mods"
]

idea.project.settings {
	runConfigurations {
		"RunServer"(org.jetbrains.gradle.ext.Application) {
			mainClass = "net.fabricmc.devlaunchinjector.Main"
			moduleName = getProject().name + ".dist.main"
			workingDirectory = "./run"
			jvmArgs = "-Dfabric.dli.config=../dist/.gradle/loom-cache/launch.cfg -Dfabric.dli.env=server -Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotServer"
			programParameters = "nogui"
		}
	}
}

// Reproducible archives: a rebuild of unchanged source gives the same bytes, so a deploy
// uploads only the jars that really changed (deploy/README.md). Loom's jar-in-jar nesting
// writes its entries with a fixed timestamp and has no setting of its own.
allprojects {
	tasks.withType(AbstractArchiveTask).configureEach {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}
}

// For all modules that are fabric mods (all mods and dist)
subprojects {
    if (nonModSubProjects.contains(it.name)) {
        return
    }
    apply plugin: "net.fabricmc.fabric-loom"
	apply plugin: "checkstyle"

    ext.initDist = { ->
        dependencies {
            rootProject.subprojects.each {
                if (nonModSubProjects.contains(it.name)) {
                    return
                }
                if (it.name == "dist") {
                    return
                }
                implementation(project(path: "${it.path}"))
                include(it)
            }
        }
    }

    ext.addProjectDependency = {dep ->
        dependencies {
            implementation project(path: dep)
        }
        test {
            dependsOn dep + ":test"
        }
    }

    ext.addLeukocyteDependency = { ->
        dependencies {
            //It is slow to update so we usually want it set to compileOnly.
            compileOnly("maven.modrinth:leukocyte:${project.leukocyte_version}")
        }
    }

    ext.addSGUIDependency = { ->
        dependencies {
            implementation("eu.pb4:sgui:${project.sgui_version}")
        }
    }

    ext.addPolymerDependency = { ->
        dependencies {
            implementation("eu.pb4:polymer-core:${project.polymer_version}")
        }
    }

    ext.addCoreDependencies = { ->
        addProjectDependency(":mods:metacraft-core")
        addPolymerDependency()
        addSGUIDependency()
        dependencies {
            implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
            implementation("org.apache.commons:commons-math3:${project.apache_commons_math_version}")
            implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}")
            implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
        }
    }

    ext.addVanishDependency = { ->
        dependencies {
            compileOnly "maven.modrinth:vanish:${project.vanish_version}"
            compileOnly "eu.pb4:player-data-api:${project.player_data_api_version}" //Dependency for Vanish.
            compileOnly("eu.pb4:placeholder-api:${project.placeholder_api_version}") //Dependency for Vanish.
        }
    }

    ext.setupRunDatagen = {modid ->
        fabricApi {
            configureDataGeneration{
                modId = modid
                client = true
            }
        }
        for (var s : gradle.startParameter.taskNames) {
            if (s.endsWith("runDatagen")) {
                tasks['sourcesJar'].dependsOn('runDatagen')
                tasks['test'].dependsOn('runDatagen')
            }
        }
    }

    group = project.maven_group

    def targetJavaVersion = 25
    tasks.withType(JavaCompile).configureEach {
        // ensure that the encoding is set to UTF-8, no matter what the system default is
        // this fixes some edge cases with special characters not displaying correctly
        // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
        // If Javadoc is generated, this must be specified in that task too.
        it.options.encoding = "UTF-8"
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            it.options.release.set(targetJavaVersion)
        }
    }

    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.name}"}
        }
    }

    processResources {
		var mcversion = project.fabric_json_mc_version.isEmpty() ? project.minecraft_version : project.fabric_json_mc_version
        inputs.property "version", project.version
        inputs.property "minecraft_version", mcversion
        inputs.property "loader_version", project.loader_version
        filteringCharset "UTF-8"

        filesMatching("fabric.mod.json") {
            expand "version": project.version,
                    "minecraft_version": mcversion,
                    "loader_version": project.loader_version,
                    "git_repo": project.git_repo,
                    "website": project.website,
                    "issues": project.issues
        }
    }

    dependencies {
        // To change the versions see the gradle.properties file
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }

    repositories {
		mavenLocal()

        //Polymer
        maven { url 'https://maven.nucleoid.xyz' }

		maven {
			name = 'ParchmentMC'
			url = 'https://maven.parchmentmc.org'
		}

		maven { url = "https://maven.bawnorton.com/releases" } // MixinSquared

        //Leukocyte
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        maven { url = 'https://maven.nucleoid.xyz/' }

        //Mod Menu
        maven {
            url "https://maven.terraformersmc.com/"
        }

        maven { url 'https://jitpack.io' } // Leukocyte
    }
}

// For all mods (but not dist)
subprojects {

    if (nonModSubProjects.contains(it.name)) {
        return
    }

    base {
        archivesName = project.name
    }

    if (project.name != "metacraft-lib") {
        addProjectDependency(":mods:metacraft-lib")
    }

    dependencies {
        // Fabric API. This is technically optional, but you probably want it anyway.
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

        implementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}") {
			transitive = false
		}

        testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

        implementation("net.bytebuddy:byte-buddy:${project.byte_buddy_version}")

        implementation("org.pcollections:pcollections:${project.pcollections_version}")
		implementation("blue.endless:jankson:${project.jankson_version}")
    }

    test {
        useJUnitPlatform()
    }
}

// Deploying mods to the servers (deploy/README.md): deploySet builds one server's set,
// deployServer uploads it. The logic and its tests live in buildSrc (nu.metacraft.deploy).
def deploySet = tasks.register('deploySet', nu.metacraft.deploy.DeploySetTask) {
    group = 'deploy'
    description = 'Builds build/deploy/<server>/ (jars and manifest.json) from deploy/<server>.txt. Needs -Pserver=<name>.'
}

// Wired once every project is evaluated, so each mod's project dependencies are complete.
gradle.projectsEvaluated {
    deploySet.configure { task ->
        def serverName = providers.gradleProperty('server').orNull
        if (serverName == null) {
            task.doFirst { throw new GradleException('deploySet needs -Pserver=<name>, for example -Pserver=test') }
            return
        }
        def listFile = file("deploy/${serverName}.txt")
        def list = nu.metacraft.deploy.DeployList.read(serverName, listFile.toPath())
        def modProjects = project(':mods').subprojects
        // Relies on addProjectDependency adding project dependencies to `implementation`.
        Map<String, Set<String>> projectDeps = modProjects.collectEntries { p ->
            [(p.name): p.configurations.getByName('implementation').dependencies
                    .withType(ProjectDependency)
                    .collect { it.path }
                    .findAll { it.startsWith(':mods:') }
                    .collect { project(it).name } as Set]
        }
        def selected = nu.metacraft.deploy.SetResolver.resolve(serverName, list.projects(), projectDeps)

        task.server = serverName
        task.listFile = listFile
        task.outputDir = layout.buildDirectory.dir("deploy/${serverName}")
        task.repoModIds = modProjects.collect {
            nu.metacraft.deploy.ModInfo.readSourceId(it.file('src/main/resources/fabric.mod.json').toPath())
        } as Set
        selected.each { name ->
            // net.fabricmc.fabric-loom (no remapping on 26.x) has no remapJar; the jar task is the mod.
            def jar = project(":mods:${name}").tasks.named('jar')
            task.dependsOn jar
            task.projectJars.put(name, jar.flatMap { it.archiveFile }.map { it.asFile })
        }
    }
}

tasks.register('deployServer', nu.metacraft.deploy.DeployServerTask) {
    group = 'deploy'
    description = 'Uploads build/deploy/<server>/ to <server> (deploy/servers.json) over SFTP. Needs -Pserver=<name> and AUTODEPLOY_PASSWORD.'
    def serverName = providers.gradleProperty('server')
    server = serverName
    deployDir = layout.projectDirectory.dir(providers.gradleProperty('deployDir')
            .orElse(serverName.map { "build/deploy/${it}".toString() }))
    serversFile = layout.projectDirectory.file(providers.gradleProperty('serversFile').orElse('deploy/servers.json'))
    dryRun = providers.gradleProperty('dryRun').map { it.toBoolean() }.orElse(false)
    summaryFile = layout.buildDirectory.file(serverName.map { "deploy/${it}.summary.md".toString() })
}
